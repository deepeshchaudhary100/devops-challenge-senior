# =============================================================================
# Reference Kubernetes Deployment Manifest
# =============================================================================
# NOTE: This manifest is provided for reference/manual use only.
# The actual deployment is managed by Terraform via the kubernetes_deployment
# resource in terraform/app.tf. You do NOT need to apply this file manually.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpletimeservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpletimeservice
  template:
    metadata:
      labels:
        app: simpletimeservice
    spec:
      containers:
        - name: simpletimeservice
          image: <your-dockerhub-username>/simpletimeservice:latest
          ports:
            - containerPort: 8080
